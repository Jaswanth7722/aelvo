name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests (auth + runtime_next)
        run: python -m pytest auth/tests/ runtime_next/tests/ -v --ignore=runtime_next/tests/stress_test.py

      - name: Run main project tests (excl. validation-only suites)
        run: python -m pytest tests/ -v --ignore=tests/test_richlog_scroll.py --ignore=tests/stress_test.py -x

      - name: Validate startup import
        run: python -c "from main import main; print('Import OK')"
